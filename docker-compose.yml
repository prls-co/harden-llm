x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - harden-private
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  caddy:
    <<: *service-defaults
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      HARDEN_LLM_API_HOST: ${HARDEN_LLM_API_HOST:?set the API hostname}
      HARDEN_LLM_ARTIFACT_HOST: ${HARDEN_LLM_ARTIFACT_HOST:?set the artifact hostname}
      HARDEN_LLM_GRAFANA_HOST: ${HARDEN_LLM_GRAFANA_HOST:?set the Grafana hostname}
      HARDEN_LLM_LANGFUSE_HOST: ${HARDEN_LLM_LANGFUSE_HOST:?set the Langfuse hostname}
      HARDEN_LLM_TLS_MODE: ${HARDEN_LLM_TLS_MODE:-internal}
      PRLS_ALLURE_HOST: ${PRLS_ALLURE_HOST:?set the Allure hostname}
      PRLS_TESTS_BASIC_AUTH_USER: ${PRLS_TESTS_BASIC_AUTH_USER:?set the PRLS tests edge user}
      PRLS_TESTS_BASIC_AUTH_HASH: ${PRLS_TESTS_BASIC_AUTH_HASH:?set the PRLS tests bcrypt hash}
    depends_on:
      harden-llm-gateway:
        condition: service_healthy
      grafana:
        condition: service_healthy
      langfuse-web:
        condition: service_started
      garage:
        condition: service_healthy
    ports:
      - "${HARDEN_LLM_BIND_ADDRESS:-0.0.0.0}:${HARDEN_LLM_HTTP_PORT:-80}:80"
      - "${HARDEN_LLM_BIND_ADDRESS:-0.0.0.0}:${HARDEN_LLM_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/conf.d:/etc/caddy/conf.d:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - harden-private
      - prls-observability
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s

  harden-llm-gateway:
    <<: *service-defaults
    image: harden-llm-gateway:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${HARDEN_LLM_RELEASE:?set an immutable release identifier}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      HARDEN_LLM_LISTEN_ADDRESS: :8080
      HARDEN_LLM_DATABASE_URL: postgresql://harden_llm:${HARDEN_LLM_POSTGRES_PASSWORD:?set the application database password}@harden-postgres:5432/harden_llm?sslmode=disable
      HARDEN_LLM_ENCRYPTION_KEYS: ${HARDEN_LLM_ENCRYPTION_KEYS:?set a JSON key-ID to base64url key mapping}
      HARDEN_LLM_ACTIVE_ENCRYPTION_KEY_ID: ${HARDEN_LLM_ACTIVE_ENCRYPTION_KEY_ID:?set the active encryption key ID}
      HARDEN_LLM_ARTIFACT_ENDPOINT: http://garage:3900
      HARDEN_LLM_ARTIFACT_EXTERNAL_ENDPOINT: ${HARDEN_LLM_ARTIFACT_EXTERNAL_ENDPOINT:?set the public HTTPS artifact origin}
      HARDEN_LLM_ARTIFACT_BUCKET: ${HARDEN_LLM_ARTIFACT_BUCKET:-harden-llm-artifacts}
      HARDEN_LLM_ARTIFACT_ACCESS_KEY_ID: ${HARDEN_LLM_ARTIFACT_ACCESS_KEY_ID:?set the Garage bucket access key}
      HARDEN_LLM_ARTIFACT_SECRET_ACCESS_KEY: ${HARDEN_LLM_ARTIFACT_SECRET_ACCESS_KEY:?set the Garage bucket secret key}
      HARDEN_LLM_ARTIFACT_PRESIGN_TTL: ${HARDEN_LLM_ARTIFACT_PRESIGN_TTL:-1m}
      HARDEN_LLM_SESSION_TTL: ${HARDEN_LLM_SESSION_TTL:-24h}
      HARDEN_LLM_STATIC_TOKEN: ${HARDEN_LLM_STATIC_TOKEN:-}
      HARDEN_LLM_STATIC_TOKEN_OWNER_ID: ${HARDEN_LLM_STATIC_TOKEN_OWNER_ID:-}
      HARDEN_LLM_MAX_RUN_DURATION_MS: ${HARDEN_LLM_MAX_RUN_DURATION_MS:-60000}
      HARDEN_LLM_PROVIDER_ALLOWED_HOSTS: ${HARDEN_LLM_PROVIDER_ALLOWED_HOSTS:-}
      HARDEN_LLM_PROVIDER_PRIVATE_ALLOWLIST: ${HARDEN_LLM_PROVIDER_PRIVATE_ALLOWLIST:-}
      HARDEN_LLM_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      HARDEN_LLM_SERVICE_NAME: harden-llm-gateway
      HARDEN_LLM_ENVIRONMENT: ${HARDEN_LLM_ENVIRONMENT:-production}
      HARDEN_LLM_RELEASE: ${HARDEN_LLM_RELEASE:?set an immutable release identifier}
    depends_on:
      harden-postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "/harden-llm-gateway", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 20s
    stop_grace_period: 70s

  harden-postgres:
    <<: *service-defaults
    image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_DB: harden_llm
      POSTGRES_USER: harden_llm
      POSTGRES_PASSWORD: ${HARDEN_LLM_POSTGRES_PASSWORD:?set the application database password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      TZ: UTC
      PGTZ: UTC
    volumes:
      - harden-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harden_llm -d harden_llm"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 60s

  garage:
    <<: *service-defaults
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${HARDEN_LLM_GARAGE_RPC_SECRET:?set a 64-character hex Garage RPC secret}
      GARAGE_DEFAULT_ACCESS_KEY: ${HARDEN_LLM_ARTIFACT_ACCESS_KEY_ID:?set the Garage bucket access key}
      GARAGE_DEFAULT_SECRET_KEY: ${HARDEN_LLM_ARTIFACT_SECRET_ACCESS_KEY:?set the Garage bucket secret key}
      GARAGE_DEFAULT_BUCKET: ${HARDEN_LLM_ARTIFACT_BUCKET:-harden-llm-artifacts}
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage-metadata:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      - harden-private
      - prls-observability
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    stop_grace_period: 60s

  otel-collector-state-init:
    image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    user: "0:0"
    entrypoint: ["/bin/chown"]
    command: ["10001:10001", "/var/lib/otelcol"]
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    volumes:
      - otel-collector-state:/var/lib/otelcol
    restart: "no"

  otel-collector:
    <<: *service-defaults
    image: otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set the Langfuse project public key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set the Langfuse project secret key}
      PRLS_LAMINAR_PROJECT_API_KEY: ${PRLS_LAMINAR_PROJECT_API_KEY:?set the Laminar PRLS project API key}
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-collector-state:/var/lib/otelcol
    networks:
      - harden-private
      - prls-observability
    depends_on:
      otel-collector-state-init:
        condition: service_completed_successfully
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      langfuse-web:
        condition: service_started
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    stop_grace_period: 10s

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${HARDEN_LLM_METRICS_RETENTION:-30d}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - harden-private
      - prls-observability
    healthcheck:
      test: ["CMD", "/bin/prometheus", "--version"]
      interval: 15s
      timeout: 5s
      retries: 8
    stop_grace_period: 30s

  loki:
    <<: *service-defaults
    image: grafana/loki:3.7.2@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86
    command: ["-config.file=/etc/loki/local-config.yaml", "-config.expand-env=true"]
    environment:
      PRLS_LOKI_S3_ACCESS_KEY: ${PRLS_LOKI_S3_ACCESS_KEY:?set the dedicated PRLS Loki Garage access key}
      PRLS_LOKI_S3_SECRET_KEY: ${PRLS_LOKI_S3_SECRET_KEY:?set the dedicated PRLS Loki Garage secret key}
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - harden-private
      - prls-observability
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 15s
      timeout: 5s
      retries: 8
    stop_grace_period: 30s

  tempo:
    <<: *service-defaults
    image: grafana/tempo:2.10.5@sha256:ee21727732c7a7199cb71c3eee9153bbf23f9b0b87619f0555a0cf21a67f1a33
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 15s
      timeout: 5s
      retries: 8
    stop_grace_period: 30s

  grafana:
    <<: *service-defaults
    image: grafana/grafana:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set the Grafana administrator password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SERVER_DOMAIN: ${HARDEN_LLM_GRAFANA_HOST:?set the Grafana hostname}
      GF_SERVER_ROOT_URL: https://${HARDEN_LLM_GRAFANA_HOST:?set the Grafana hostname}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - harden-private
      - prls-observability
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    stop_grace_period: 30s

networks:
  harden-private:
    driver: bridge
  prls-observability:
    name: prls-observability
    external: true

volumes:
  caddy-data:
  caddy-config:
  harden-postgres-data:
  garage-metadata:
  garage-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  otel-collector-state:
