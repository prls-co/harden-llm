x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - harden-private
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  harden-llm-gateway:
    <<: *service-defaults
    image: harden-llm-gateway:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - private_module_token
      args:
        VERSION: ${HARDEN_LLM_RELEASE:?set an immutable release identifier}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ${HARDEN_LLM_CONFIG_FILE:?set the connection configuration file}:/etc/harden-llm/upstreams.json:ro
    environment:
      HARDEN_LLM_LISTEN_ADDRESS: :8080
      HARDEN_LLM_CONFIG_FILE: /etc/harden-llm/upstreams.json
      HARDEN_LLM_TOKEN: ${HARDEN_LLM_TOKEN:?set the OpenAI-compatible API bearer token}
      CPA_API_KEY: ${CPA_API_KEY:?set the CPA upstream API key}
      JINA_API_KEY: ${JINA_API_KEY:-}
      HARDEN_LLM_MAX_RUN_DURATION_MS: ${HARDEN_LLM_MAX_RUN_DURATION_MS:-60000}
      HARDEN_LLM_PROVIDER_ALLOWED_HOSTS: ${HARDEN_LLM_PROVIDER_ALLOWED_HOSTS:-}
      HARDEN_LLM_PROVIDER_PRIVATE_ALLOWLIST: ${HARDEN_LLM_PROVIDER_PRIVATE_ALLOWLIST:-}
      HARDEN_LLM_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      HARDEN_LLM_SERVICE_NAME: harden-llm-gateway
      HARDEN_LLM_ENVIRONMENT: ${HARDEN_LLM_ENVIRONMENT:-production}
      HARDEN_LLM_RELEASE: ${HARDEN_LLM_RELEASE:?set an immutable release identifier}
    networks:
      - harden-private
      - prls-observability
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "/harden-llm-gateway", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 20s
    stop_grace_period: 70s

  otel-collector-state-init:
    image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    user: "0:0"
    entrypoint: ["/bin/chown"]
    command: ["10001:10001", "/var/lib/otelcol"]
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    volumes:
      - otel-collector-state:/var/lib/otelcol
    restart: "no"

  otel-collector:
    <<: *service-defaults
    image: otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      PRLS_LAMINAR_PROJECT_API_KEY: ${PRLS_LAMINAR_PROJECT_API_KEY:?set the Laminar PRLS project API key}
      HARDEN_LLM_LAMINAR_PROJECT_API_KEY: ${HARDEN_LLM_LAMINAR_PROJECT_API_KEY:?set the dedicated Harden LLM Laminar ingest key}
      HARDEN_LLM_LAMINAR_ENDPOINT: ${HARDEN_LLM_LAMINAR_ENDPOINT:-laminar:8001}
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-collector-state:/var/lib/otelcol
    networks:
      - harden-private
      - prls-observability
    depends_on:
      otel-collector-state-init:
        condition: service_completed_successfully
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    stop_grace_period: 10s

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${HARDEN_LLM_METRICS_RETENTION:-30d}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - harden-private
      - prls-observability
    healthcheck:
      test: ["CMD", "/bin/prometheus", "--version"]
      interval: 15s
      timeout: 5s
      retries: 8
    stop_grace_period: 30s

  loki:
    <<: *service-defaults
    image: grafana/loki:3.7.2@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86
    command: ["-config.file=/etc/loki/local-config.yaml", "-config.expand-env=true"]
    environment:
      PRLS_LOKI_S3_ACCESS_KEY: ${PRLS_LOKI_S3_ACCESS_KEY:?set the dedicated PRLS Loki Garage access key}
      PRLS_LOKI_S3_SECRET_KEY: ${PRLS_LOKI_S3_SECRET_KEY:?set the dedicated PRLS Loki Garage secret key}
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - harden-private
      - prls-observability
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 15s
      timeout: 5s
      retries: 8
    stop_grace_period: 30s

  tempo:
    <<: *service-defaults
    image: grafana/tempo:2.10.5@sha256:ee21727732c7a7199cb71c3eee9153bbf23f9b0b87619f0555a0cf21a67f1a33
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 15s
      timeout: 5s
      retries: 8
    stop_grace_period: 30s

  grafana:
    <<: *service-defaults
    image: grafana/grafana:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set the Grafana administrator password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SERVER_DOMAIN: ${HARDEN_LLM_GRAFANA_HOST:?set the Grafana hostname}
      GF_SERVER_ROOT_URL: https://${HARDEN_LLM_GRAFANA_HOST:?set the Grafana hostname}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - harden-private
      - prls-observability
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    stop_grace_period: 30s

networks:
  harden-private:
    driver: bridge
  prls-observability:
    name: prls-observability
    external: true

secrets:
  private_module_token:
    environment: PRIVATE_MODULE_TOKEN

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  otel-collector-state:
