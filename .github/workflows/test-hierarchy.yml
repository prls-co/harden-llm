name: Harden-LLM test hierarchy

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md', 'docs/**', 'plans/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'plans/**']
  workflow_dispatch:
    inputs:
      suite:
        description: 'Browser tests run ONLY when explicitly selected here'
        type: choice
        default: fast
        options: [fast, integration, release, browser, full-with-browser]
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: harden-llm-hierarchy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"
  NODE_VERSION: "22.22.1"
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "28.4.3"

jobs:
  mode:
    runs-on: ubuntu-latest
    outputs:
      fast: ${{ steps.mode.outputs.fast }}
      integration: ${{ steps.mode.outputs.integration }}
      release: ${{ steps.mode.outputs.release }}
      browser: ${{ steps.mode.outputs.browser }}
      browserCompose: ${{ steps.mode.outputs.browserCompose }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        env:
          SUITE: ${{ inputs.suite }}
        run: node scripts/preview-policy.mjs ci

  fast:
    name: fast T0-T2
    needs: mode
    if: needs.mode.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: harden-llm-fast-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: go mod download
      - working-directory: frontend
        run: mix deps.get
      - run: make test-fast

  integration:
    name: pooled T3 integration
    needs: mode
    if: needs.mode.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: harden-llm-integration-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: make test-integration
      - run: make test-integration-race

  browser:
    name: explicitly requested browser checks
    needs: mode
    if: needs.mode.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: harden-llm-browser-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - working-directory: frontend
        run: mix deps.get
      - run: docker build --tag harden-llm-browser-test:local --file frontend/Dockerfile.browser .
      - run: make test-browser
      - if: needs.mode.outputs.browserCompose == 'true'
        run: make test-browser-compose

  release:
    name: browser-free release
    needs: mode
    if: needs.mode.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: harden-llm-release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: go mod download
      - working-directory: frontend
        run: mix deps.get
      - run: make test-release
