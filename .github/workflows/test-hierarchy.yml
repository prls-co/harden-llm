name: Harden-LLM test hierarchy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: harden-llm-hierarchy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"
  NODE_VERSION: "22.22.1"
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "28.4.3"

jobs:
  fast:
    name: fast T0-T2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: harden-llm-fast-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: go mod download
      - working-directory: frontend
        run: mix deps.get
      - run: make test-fast

  integration:
    name: pooled T3 integration
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'test:full')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: harden-llm-integration-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: make test-integration
      - run: make test-integration-race

  browser:
    name: targeted T4 browser
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'test:full')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: harden-llm-browser-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - working-directory: frontend
        run: mix deps.get
      - run: docker build --tag harden-llm-browser-test:local --file frontend/Dockerfile.browser .
      - run: make test-browser

  release:
    name: release candidate T3-T5
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'test:full')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: harden-llm-release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: go mod download
      - working-directory: frontend
        run: mix deps.get
      - run: docker build --tag harden-llm-browser-test:local --file frontend/Dockerfile.browser .
      - run: make test-release
