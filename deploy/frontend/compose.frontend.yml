services:
  caddy:
    environment:
      HARDEN_LLM_WEB_HOST: ${HARDEN_LLM_WEB_HOST:?set the web hostname}
    volumes:
      - ./deploy/frontend:/etc/caddy/overlays:ro
    depends_on:
      harden-llm-web:
        condition: service_healthy

  harden-llm-web:
    image: harden-llm-web:1.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VERSION: ${HARDEN_LLM_RELEASE:?set an immutable release identifier}
    init: true
    restart: unless-stopped
    networks:
      - harden-private
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      PHX_SERVER: "true"
      HARDEN_LLM_WEB_HOST: ${HARDEN_LLM_WEB_HOST:?set the web hostname}
      HARDEN_LLM_WEB_PORT: "4000"
      HARDEN_LLM_WEB_SECRET_KEY_BASE: ${HARDEN_LLM_WEB_SECRET_KEY_BASE:?set the Phoenix secret key base}
      HARDEN_LLM_WEB_SESSION_SIGNING_SALT: ${HARDEN_LLM_WEB_SESSION_SIGNING_SALT:?set the session signing salt}
      HARDEN_LLM_WEB_SESSION_ENCRYPTION_SALT: ${HARDEN_LLM_WEB_SESSION_ENCRYPTION_SALT:?set the session encryption salt}
      HARDEN_LLM_WEB_SESSION_VAULT_PATH: /var/lib/harden-llm-web/session-vault.dets
      HARDEN_LLM_API_BASE_URL: http://harden-llm-gateway:8080
      HARDEN_LLM_PUBLIC_API_BASE_URL: https://${HARDEN_LLM_API_HOST:?set the API hostname}
      HARDEN_LLM_WEB_API_TIMEOUT_MS: ${HARDEN_LLM_WEB_API_TIMEOUT_MS:-15000}
      HARDEN_LLM_WEB_RUN_TIMEOUT_MS: ${HARDEN_LLM_WEB_RUN_TIMEOUT_MS:-65000}
      HARDEN_LLM_MAX_RUN_DURATION_MS: ${HARDEN_LLM_MAX_RUN_DURATION_MS:-60000}
      HARDEN_LLM_ARTIFACT_PUBLIC_ORIGIN: ${HARDEN_LLM_ARTIFACT_EXTERNAL_ENDPOINT:?set the public artifact origin}
      HARDEN_LLM_WEB_INSTANCE_ID: ${HARDEN_LLM_WEB_INSTANCE_ID:-harden-llm-web-1}
      HARDEN_LLM_WEB_LOG_PATH: /var/log/harden-llm-web/app.jsonl
      HARDEN_LLM_WEB_LOG_MAX_BYTES: ${HARDEN_LLM_WEB_LOG_MAX_BYTES:-10485760}
      HARDEN_LLM_WEB_LOG_MAX_FILES: ${HARDEN_LLM_WEB_LOG_MAX_FILES:-5}
      HARDEN_LLM_WEB_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      HARDEN_LLM_WEB_SERVICE_NAME: harden-llm-web
      HARDEN_LLM_WEB_ENVIRONMENT: ${HARDEN_LLM_ENVIRONMENT:-production}
      HARDEN_LLM_WEB_RELEASE: ${HARDEN_LLM_RELEASE:?set an immutable release identifier}
      HARDEN_LLM_ENVIRONMENT: ${HARDEN_LLM_ENVIRONMENT:-production}
      HARDEN_LLM_RELEASE: ${HARDEN_LLM_RELEASE:?set an immutable release identifier}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - harden-llm-web-logs:/var/log/harden-llm-web
      - harden-llm-web-sessions:/var/lib/harden-llm-web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    stop_grace_period: 20s

  otel-collector:
    command:
      - --config=file:/etc/otelcol-contrib/config.yaml
      - --config=file:/etc/otelcol-contrib/frontend.yaml
    environment:
      HARDEN_LLM_ENVIRONMENT: ${HARDEN_LLM_ENVIRONMENT:-production}
      HARDEN_LLM_RELEASE: ${HARDEN_LLM_RELEASE:?set an immutable release identifier}
      HARDEN_LLM_WEB_INSTANCE_ID: ${HARDEN_LLM_WEB_INSTANCE_ID:-harden-llm-web-1}
    volumes:
      - ./deploy/frontend/otel.frontend.yaml:/etc/otelcol-contrib/frontend.yaml:ro
      - harden-llm-web-logs:/var/log/harden-llm-web:ro
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - validate
        - --config=file:/etc/otelcol-contrib/config.yaml
        - --config=file:/etc/otelcol-contrib/frontend.yaml

  grafana:
    volumes:
      - ./deploy/frontend:/var/lib/grafana/frontend-dashboards:ro

volumes:
  harden-llm-web-logs:
  harden-llm-web-sessions:
