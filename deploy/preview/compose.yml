# Preview-only services. Never combine this file with production Compose.
x-defaults: &defaults
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  networks: [private]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
  labels:
    co.prls.harden.preview: ${PREVIEW_ID:?}

services:
  postgres:
    <<: *defaults
    image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_DB: harden_llm
      POSTGRES_USER: harden_llm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U harden_llm -d harden_llm']
      interval: 2s
      timeout: 3s
      retries: 30

  garage:
    <<: *defaults
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    command: ${PREVIEW_GARAGE_COMMAND:-/garage server}
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${ARTIFACT_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${ARTIFACT_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: harden-llm-artifacts
    networks:
      private:
        aliases: ['${PREVIEW_PROJECT}-garage']
    volumes:
      - ${PREVIEW_CONTROL}/garage.toml:/etc/garage.toml:ro
      - garage-metadata:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: [CMD, /garage, status]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    <<: *defaults
    image: ${GATEWAY_IMAGE:?}
    init: true
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    networks:
      private:
        aliases: ['${PREVIEW_PROJECT}-gateway']
    environment:
      HARDEN_LLM_LISTEN_ADDRESS: :8080
      HARDEN_LLM_DATABASE_URL: postgresql://harden_llm:${POSTGRES_PASSWORD}@postgres:5432/harden_llm?sslmode=disable
      HARDEN_LLM_ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?}
      HARDEN_LLM_ACTIVE_ENCRYPTION_KEY_ID: preview
      HARDEN_LLM_ARTIFACT_ENDPOINT: http://garage:3900
      HARDEN_LLM_ARTIFACT_EXTERNAL_ENDPOINT: https://${PREVIEW_HOST}
      HARDEN_LLM_ARTIFACT_BUCKET: harden-llm-artifacts
      HARDEN_LLM_ARTIFACT_ACCESS_KEY_ID: ${ARTIFACT_ACCESS_KEY}
      HARDEN_LLM_ARTIFACT_SECRET_ACCESS_KEY: ${ARTIFACT_SECRET_KEY}
      HARDEN_LLM_ARTIFACT_PRESIGN_TTL: ${HARDEN_LLM_ARTIFACT_PRESIGN_TTL:-1m}
      HARDEN_LLM_SESSION_TTL: ${HARDEN_LLM_SESSION_TTL:-24h}
      HARDEN_LLM_MAX_RUN_DURATION_MS: ${HARDEN_LLM_MAX_RUN_DURATION_MS:-60000}
      HARDEN_LLM_PROVIDER_ALLOWED_HOSTS: ${HARDEN_LLM_PROVIDER_ALLOWED_HOSTS:-}
      HARDEN_LLM_PROVIDER_PRIVATE_ALLOWLIST: ${HARDEN_LLM_PROVIDER_PRIVATE_ALLOWLIST:-}
      HARDEN_LLM_OTEL_EXPORTER_OTLP_ENDPOINT: ''
      HARDEN_LLM_SERVICE_NAME: harden-llm-preview-gateway
      # Existing development mode explicitly permits no telemetry exporter.
      HARDEN_LLM_ENVIRONMENT: development
      HARDEN_LLM_RELEASE: ${GATEWAY_RELEASE:?}
    depends_on:
      postgres: {condition: service_healthy}
      garage: {condition: service_healthy}
    healthcheck:
      test: [CMD, /harden-llm-gateway, healthcheck]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 70s

  web:
    <<: *defaults
    image: ${WEB_IMAGE:?}
    init: true
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    networks:
      private:
        aliases: ['${PREVIEW_PROJECT}-web']
    environment:
      PHX_SERVER: 'true'
      HARDEN_LLM_WEB_HOST: ${PREVIEW_HOST}
      HARDEN_LLM_WEB_PORT: '4000'
      HARDEN_LLM_WEB_SECRET_KEY_BASE: ${WEB_SECRET:?}
      HARDEN_LLM_WEB_SESSION_SIGNING_SALT: ${WEB_SIGNING_SALT:?}
      HARDEN_LLM_WEB_SESSION_ENCRYPTION_SALT: ${WEB_ENCRYPTION_SALT:?}
      HARDEN_LLM_WEB_SESSION_VAULT_PATH: /var/lib/harden-llm-web/session-vault.dets
      HARDEN_LLM_API_BASE_URL: http://gateway:8080
      HARDEN_LLM_PUBLIC_API_BASE_URL: https://${PREVIEW_HOST}
      HARDEN_LLM_ARTIFACT_PUBLIC_ORIGIN: https://${PREVIEW_HOST}
      HARDEN_LLM_WEB_INSTANCE_ID: ${PREVIEW_PROJECT}
      HARDEN_LLM_WEB_API_TIMEOUT_MS: ${HARDEN_LLM_WEB_API_TIMEOUT_MS:-15000}
      HARDEN_LLM_WEB_RUN_TIMEOUT_MS: ${HARDEN_LLM_WEB_RUN_TIMEOUT_MS:-65000}
      HARDEN_LLM_WEB_LOG_MAX_BYTES: ${HARDEN_LLM_WEB_LOG_MAX_BYTES:-10485760}
      HARDEN_LLM_WEB_LOG_MAX_FILES: ${HARDEN_LLM_WEB_LOG_MAX_FILES:-5}
      HARDEN_LLM_WEB_SERVICE_NAME: harden-llm-preview-web
      HARDEN_LLM_ENVIRONMENT: preview-${PREVIEW_ID}
      HARDEN_LLM_RELEASE: ${WEB_RELEASE:?}
      OTEL_SDK_DISABLED: 'true'
    volumes:
      - web-logs:/var/log/harden-llm-web
      - web-sessions:/var/lib/harden-llm-web
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:4000/healthz']
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

networks:
  private:
    name: ${PREVIEW_PROJECT}-private
volumes:
  postgres-data:
  garage-metadata:
  garage-data:
  web-logs:
  web-sessions:
