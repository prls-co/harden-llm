extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}
  file_storage/harden_llm_web:
    directory: /var/lib/otelcol
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  otlp/prls_prod:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14317
      http:
        endpoint: 0.0.0.0:14318
  otlp/prls_nonprod:
    protocols:
      grpc:
        endpoint: 0.0.0.0:24317
      http:
        endpoint: 0.0.0.0:24318
  otlp/prls_test:
    protocols:
      grpc:
        endpoint: 0.0.0.0:34317
      http:
        endpoint: 0.0.0.0:34318
  http_check/allure:
    collection_interval: 15s
    initial_delay: 1s
    targets:
      - endpoint: http://allure:3000/api/ping
        method: GET
        timeout: 5s

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 1024
    spike_limit_mib: 256
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.proxy_authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: gen_ai.request.messages
        action: delete
      - key: gen_ai.response.text
        action: delete
      - key: db.statement
        action: delete
      - key: url.full
        action: delete
      - key: server.address
        action: delete
  attributes/prls_credentials:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.proxy_authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set_cookie
        action: delete
      - key: db.connection_string
        action: delete
      - key: gen_ai.request.api_key
        action: delete
      - key: prls.auth.token
        action: delete
  resource/prls_prod:
    attributes:
      - key: deployment.environment
        value: prod
        action: upsert
      - key: service.namespace
        value: prls-agents
        action: upsert
  resource/prls_nonprod:
    attributes:
      - key: deployment.environment
        value: nonprod
        action: upsert
      - key: service.namespace
        value: prls-agents
        action: upsert
  resource/prls_test:
    attributes:
      - key: deployment.environment
        value: test
        action: upsert
      - key: service.namespace
        value: prls-agents
        action: upsert
  filter/langfuse:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] != "harden-llm-gateway"'
  tail_sampling/langfuse:
    decision_wait: 75s
    num_traces: 20000
    expected_new_traces_per_sec: 200
    policies:
      - name: harden-llm-gateway-complete-traces
        type: string_attribute
        string_attribute:
          key: service.name
          values:
            - harden-llm-gateway
          enabled_regex_matching: false
  batch/tempo:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  batch/langfuse:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  batch/metrics:
    timeout: 2s
    send_batch_size: 1024
    send_batch_max_size: 2048
  batch/logs:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  batch/prls_traces:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  batch/prls_logs:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  batch/prls_metrics:
    timeout: 2s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    compression: gzip
    timeout: 5s
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    headers:
      X-Scope-OrgID: fake
    compression: gzip
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    auth:
      authenticator: basicauth/langfuse
    headers:
      x-langfuse-ingestion-version: "4"
    compression: gzip
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  otlphttp/loki_prls_prod:
    endpoint: http://loki:3100/otlp
    headers:
      X-Scope-OrgID: prod
    compression: gzip
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  otlphttp/loki_prls_nonprod:
    endpoint: http://loki:3100/otlp
    headers:
      X-Scope-OrgID: nonprod
    compression: gzip
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  otlphttp/loki_prls_test:
    endpoint: http://loki:3100/otlp
    headers:
      X-Scope-OrgID: test
    compression: gzip
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  otlp/prls_laminar:
    endpoint: laminar:8001
    headers:
      authorization: Bearer ${env:PRLS_LAMINAR_PROJECT_API_KEY}
    compression: gzip
    timeout: 5s
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 4096
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  prometheus:
    endpoint: 0.0.0.0:9464
    enable_open_metrics: true
    without_scope_info: true
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    metric_expiration: 5m

service:
  extensions:
    - health_check
    - basicauth/langfuse
    - file_storage/harden_llm_web
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces/tempo:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes/redact
        - batch/tempo
      exporters:
        - otlp/tempo
    traces/langfuse:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes/redact
        - filter/langfuse
        - tail_sampling/langfuse
        - batch/langfuse
      exporters:
        - otlphttp/langfuse
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes/redact
        - batch/metrics
      exporters:
        - prometheus
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes/redact
        - batch/logs
      exporters:
        - otlphttp/loki
    traces/prls_prod:
      receivers:
        - otlp/prls_prod
      processors:
        - memory_limiter
        - attributes/prls_credentials
        - resource/prls_prod
        - batch/prls_traces
      exporters:
        - otlp/prls_laminar
    logs/prls_prod:
      receivers:
        - otlp/prls_prod
      processors:
        - memory_limiter
        - attributes/prls_credentials
        - resource/prls_prod
        - batch/prls_logs
      exporters:
        - otlphttp/loki_prls_prod
    metrics/prls_prod:
      receivers:
        - otlp/prls_prod
      processors:
        - memory_limiter
        - attributes/prls_credentials
        - resource/prls_prod
        - batch/prls_metrics
      exporters:
        - prometheus
    traces/prls_nonprod:
      receivers:
        - otlp/prls_nonprod
      processors:
        - memory_limiter
        - attributes/prls_credentials
        - resource/prls_nonprod
        - batch/prls_traces
      exporters:
        - otlp/prls_laminar
    logs/prls_nonprod:
      receivers:
        - otlp/prls_nonprod
      processors:
        - memory_limiter
        - attributes/prls_credentials
        - resource/prls_nonprod
        - batch/prls_logs
      exporters:
        - otlphttp/loki_prls_nonprod
    metrics/prls_nonprod:
      receivers:
        - otlp/prls_nonprod
      processors:
        - memory_limiter
        - attributes/prls_credentials
        - resource/prls_nonprod
        - batch/prls_metrics
      exporters:
        - prometheus
    traces/prls_test:
      receivers:
        - otlp/prls_test
      processors:
        - memory_limiter
        - attributes/prls_credentials
        - resource/prls_test
        - batch/prls_traces
      exporters:
        - otlp/prls_laminar
    logs/prls_test:
      receivers:
        - otlp/prls_test
      processors:
        - memory_limiter
        - attributes/prls_credentials
        - resource/prls_test
        - batch/prls_logs
      exporters:
        - otlphttp/loki_prls_test
    metrics/prls_test:
      receivers:
        - otlp/prls_test
      processors:
        - memory_limiter
        - attributes/prls_credentials
        - resource/prls_test
        - batch/prls_metrics
      exporters:
        - prometheus
    metrics/allure_health:
      receivers:
        - http_check/allure
      processors:
        - memory_limiter
        - batch/prls_metrics
      exporters:
        - prometheus
