apiVersion: 1

providers:
  - name: harden-llm
    orgId: 1
    folder: Harden LLM
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
  - name: harden-llm-web
    orgId: 1
    folder: Harden LLM Web
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/frontend-dashboards
      foldersFromFilesStructure: false
