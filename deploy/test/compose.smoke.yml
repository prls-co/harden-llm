services:
  laminar:
    image: otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    environment:
      HARDEN_LLM_LAMINAR_PROJECT_API_KEY: ${HARDEN_LLM_LAMINAR_PROJECT_API_KEY:?set the generated smoke Laminar token}
    volumes:
      - ./deploy/test/laminar-sink.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      prls-observability:
        aliases: [laminar]
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    environment:
      HARDEN_LLM_API_HOST: ${HARDEN_LLM_API_HOST:?set the API hostname}
      HARDEN_LLM_ARTIFACT_HOST: ${HARDEN_LLM_ARTIFACT_HOST:?set the artifact hostname}
      HARDEN_LLM_GRAFANA_HOST: ${HARDEN_LLM_GRAFANA_HOST:?set the Grafana hostname}
      HARDEN_LLM_LANGFUSE_HOST: ${HARDEN_LLM_LANGFUSE_HOST:?set the Langfuse hostname}
      HARDEN_LLM_TLS_MODE: ${HARDEN_LLM_TLS_MODE:-internal}
    depends_on:
      harden-llm-gateway:
        condition: service_healthy
      grafana:
        condition: service_healthy
      langfuse-web:
        condition: service_started
      garage:
        condition: service_healthy
    ports:
      - "${HARDEN_LLM_BIND_ADDRESS:-127.0.0.1}:${HARDEN_LLM_HTTP_PORT:-18080}:80"
      - "${HARDEN_LLM_BIND_ADDRESS:-127.0.0.1}:${HARDEN_LLM_HTTPS_PORT:-18443}:443"
    volumes:
      - ./deploy/test/Caddyfile.smoke:/etc/caddy/Caddyfile:ro
      - caddy-smoke-data:/data
      - caddy-smoke-config:/config
    networks:
      harden-private: {}
      prls-observability: {}
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s

  garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: "no"
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set the generated smoke Garage RPC secret}
      GARAGE_DEFAULT_ACCESS_KEY: ${HARDEN_LLM_ARTIFACT_ACCESS_KEY_ID:?set the generated smoke artifact key}
      GARAGE_DEFAULT_SECRET_KEY: ${HARDEN_LLM_ARTIFACT_SECRET_ACCESS_KEY:?set the generated smoke artifact secret}
      GARAGE_DEFAULT_BUCKET: ${HARDEN_LLM_ARTIFACT_BUCKET:-harden-llm-artifacts-smoke}
    volumes:
      - ./deploy/test/garage.toml:/etc/garage.toml:ro
      - garage-metadata:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      harden-private: {}
      prls-observability:
        aliases: [garage-shared]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 1s
      timeout: 3s
      retries: 45
    stop_grace_period: 10s

  harden-llm-gateway:
    environment:
      HARDEN_LLM_PROVIDER_ALLOWED_HOSTS: ""
      HARDEN_LLM_PROVIDER_PRIVATE_ALLOWLIST: fake-provider
      SSL_CERT_FILE: /run/smoke/provider-ca.crt
    volumes:
      - ${SMOKE_CA_CERT:?set the generated smoke CA path}:/run/smoke/provider-ca.crt:ro
    depends_on:
      garage:
        condition: service_healthy
      fake-provider:
        condition: service_healthy

  fake-provider:
    image: harden-llm-fake-provider:0.1.0
    build:
      context: .
      dockerfile: deploy/test/fake-provider.Dockerfile
    command: ["serve", "--cert", "/run/smoke/provider.crt", "--key", "/run/smoke/provider.key"]
    restart: unless-stopped
    networks:
      - harden-private
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${SMOKE_PROVIDER_CERT:?set the generated smoke provider certificate path}:/run/smoke/provider.crt:ro
      - ${SMOKE_PROVIDER_KEY:?set the generated smoke provider key path}:/run/smoke/provider.key:ro
    healthcheck:
      test: ["CMD", "/fake-provider", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  loki:
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./deploy/test/loki.smoke.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  otel-collector:
    depends_on:
      laminar:
        condition: service_healthy

volumes:
  caddy-smoke-data:
  caddy-smoke-config:
  garage-metadata:
  garage-data:

networks:
  harden-private:
    driver: bridge
    ipam:
      config:
        - subnet: 203.0.113.0/24
  prls-observability:
    name: ${PRLS_SMOKE_OBSERVABILITY_NETWORK:?set the unique smoke observability network}
    external: false
    driver: bridge
    ipam:
      config:
        - subnet: 198.18.0.0/24
