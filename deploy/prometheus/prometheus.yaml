global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/harden-llm-artifact-lifecycle.yaml
  - /etc/prometheus/rules/prls-test-observability.yaml

scrape_configs:
  - job_name: harden-llm
    static_configs:
      - targets:
          - otel-collector:9464
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888
