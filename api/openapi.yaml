      required: [schemaVersion, credentialId, scope, origin, apiInferenceTypes, configured, createdAt]
      properties:
        schemaVersion: {type: integer, const: 1}
        credentialId: {$ref: "#/components/schemas/Identifier"}
        scope: {type: string, enum: [global, user]}
        origin: {type: string, format: uri, pattern: "^https://", maxLength: 2048}
        apiInferenceTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [chat-completions, responses, gemini-generate-content, anthropic-messages]
        configured: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProfileState:
      type: object
      additionalProperties: false
      required: [profile, credential]
      properties:
        profile: {$ref: "#/components/schemas/Profile"}
        credential: {$ref: "#/components/schemas/CredentialState"}
    ProfileSaveRequest:
      type: object
      additionalProperties: false
      required: [profile, credentialId]
      properties:
        profile: {$ref: "#/components/schemas/Profile"}
        credentialId: {$ref: "#/components/schemas/Identifier"}
        credential: {$ref: "#/components/schemas/CredentialPayload"}
    ProfilesEnvelope:
      type: object
      additionalProperties: false
      required:
      - state
      - result
      - error
      properties:
        state:
          $ref: '#/components/schemas/EmptyState'
        result:
          type: object
          additionalProperties: false
          required:
          - profiles
          - defaults
          properties:
            profiles:
              type: array
              items:
                $ref: '#/components/schemas/ProfileState'
            defaults:
              type: object
              additionalProperties: false
              required:
              - recoveryPolicy
              properties:
                recoveryPolicy:
                  $ref: '#/components/schemas/RecoveryPolicy'
        error:
          type: 'null'
    ProfileEnvelope:
      type: object
      additionalProperties: false
      required: [state, result, error]
      properties:
        state: {$ref: "#/components/schemas/EmptyState"}
        result: {$ref: "#/components/schemas/ProfileState"}
        error: {type: "null"}
    CredentialBinding:
      type: object
      additionalProperties: false
      required: [ownerId, credentialId, origin]
      properties:
        ownerId: {$ref: "#/components/schemas/Identifier"}
        credentialId: {$ref: "#/components/schemas/Identifier"}
        origin: {type: string, format: uri, pattern: "^https://", maxLength: 2048}
    EncryptedCredential:
      type: object
      additionalProperties: false
      required: [schemaVersion, algorithm, keyId, nonce, ciphertext]
      properties:
        schemaVersion: {type: integer, const: 1}
        algorithm: {type: string, const: AES-256-GCM}
        keyId: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}
        nonce: {type: string, minLength: 16, maxLength: 16, pattern: "^[A-Za-z0-9_-]+$"}
        ciphertext: {type: string, minLength: 22, pattern: "^[A-Za-z0-9_-]+$"}
    CredentialRecord:
      type: object
      additionalProperties: false
      required: [schemaVersion, binding, scope, apiInferenceTypes, encrypted, createdAt]
      properties:
        schemaVersion: {type: integer, const: 1}
        binding: {$ref: "#/components/schemas/CredentialBinding"}
        scope: {type: string, enum: [global, user]}
        apiInferenceTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [chat-completions, responses, gemini-generate-content, anthropic-messages]
        encrypted: {$ref: "#/components/schemas/EncryptedCredential"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProfileBundle:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - bundleId
      - createdAt
      - profiles
      - credentialIds
      - credentials
      properties:
        schemaVersion:
          type: integer
          const: 3
        bundleId:
          $ref: '#/components/schemas/Identifier'
        createdAt:
          type: string
          format: date-time
        profiles:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Profile'
        credentialIds:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Identifier'
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/CredentialRecord'
    BundleEnvelope:
      type: object
      additionalProperties: false
      required: [state, result, error]
      properties:
        state: {$ref: "#/components/schemas/EmptyState"}
        result: {$ref: "#/components/schemas/ProfileBundle"}
        error: {type: "null"}
    HistoryItem:
      type: object
      additionalProperties: false
      required: [runId, profileId, traceId, status, request, result, startedAt, completedAt]
      properties:
        runId: {$ref: "#/components/schemas/Identifier"}
        profileId: {$ref: "#/components/schemas/ProfileID"}
        traceId: {$ref: "#/components/schemas/Identifier"}
        status: {type: string, enum: [succeeded, failed, timeout]}
        request: {type: object}
        result: {$ref: "#/components/schemas/RunResult"}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    HistoryEnvelope:
      type: object
      additionalProperties: false
      required: [state, result, error]
      properties:
        state: {$ref: "#/components/schemas/EmptyState"}
        result:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              maxItems: 100
              items: {$ref: "#/components/schemas/HistoryItem"}
            nextCursor: {type: string, minLength: 1, maxLength: 512}
        error: {type: "null"}
    HistoryNumberedEnvelope:
      type: object
      additionalProperties: false
      required: [state, result, error]
      properties:
        state: {$ref: "#/components/schemas/EmptyState"}
        result:
          type: object
          additionalProperties: false
          required: [items, pagination]
          properties:
            items:
              type: array
              maxItems: 100
              items: {$ref: "#/components/schemas/HistoryItem"}
            pagination: {$ref: "#/components/schemas/HistoryPagination"}
        error: {type: "null"}
    HistoryPagination:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalCount]
      properties:
        page: {type: integer, format: int64, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        totalCount: {type: integer, format: int64, minimum: 0}
    DeleteHistoryEnvelope:
      type: object
      additionalProperties: false
      required: [state, result, error]
      properties:
        state: {$ref: "#/components/schemas/EmptyState"}
        result:
          type: object
          additionalProperties: false
          required: [deleted, runId]
          properties:
            deleted: {type: boolean, const: true}
            runId: {$ref: "#/components/schemas/Identifier"}
        error: {type: "null"}
    ClearHistoryEnvelope:
      type: object
      additionalProperties: false
      required: [state, result, error]
      properties:
        state: {$ref: "#/components/schemas/EmptyState"}
        result:
          type: object
          additionalProperties: false
          required: [deletedCount]
          properties:
            deletedCount: {type: integer, minimum: 0}
        error: {type: "null"}
    Stats:
      type: object
      additionalProperties: false
      required: [schemaVersion, totalCount, successCount, failureCount, timeoutCount, resultAccounting, providerAccounting, cached, totalCallDurationMs, maxCallDurationMs, overBudgetCount, maxOverBudgetMs]
      properties:
        schemaVersion: {type: integer, const: 2}
        totalCount: {type: integer, minimum: 0}
        successCount: {type: integer, minimum: 0}
        failureCount: {type: integer, minimum: 0}
        timeoutCount: {type: integer, minimum: 0}
        resultAccounting: {$ref: "#/components/schemas/AccountingStats"}
        providerAccounting: {$ref: "#/components/schemas/AccountingStats"}
        cached:
          type: object
          additionalProperties: false
          required: [count, cost]
          properties:
            count: {type: integer, minimum: 0}
            cost: {$ref: "#/components/schemas/CostStats"}
        totalCallDurationMs: {type: integer, minimum: 0}
        maxCallDurationMs: {type: integer, minimum: 0}
        overBudgetCount: {type: integer, minimum: 0}
        maxOverBudgetMs: {type: integer, minimum: 0}
    UsageCoverage:
      type: object
      additionalProperties: false
      required: [complete, partial, unavailable, inconsistent]
      properties:
        complete: {type: integer, minimum: 0}
        partial: {type: integer, minimum: 0}
        unavailable: {type: integer, minimum: 0}
        inconsistent: {type: integer, minimum: 0}
    UsageStats:
      type: object
      additionalProperties: false
      required: [promptTokens, cacheReadTokens, cacheCreationTokens, outputTokens, reasoningTokens, totalTokens, coverage]
      properties:
        promptTokens: {type: integer, minimum: 0}
        cacheReadTokens: {type: integer, minimum: 0}
        cacheCreationTokens: {type: integer, minimum: 0}
        outputTokens: {type: integer, minimum: 0}
        reasoningTokens: {type: integer, minimum: 0}
        totalTokens: {type: integer, minimum: 0}
        coverage: {$ref: "#/components/schemas/UsageCoverage"}
    CostCoverage:
      type: object
      additionalProperties: false
      required: [exact, partial, unknown, unavailable]
      properties:
        exact: {type: integer, minimum: 0}
        partial: {type: integer, minimum: 0}
        unknown: {type: integer, minimum: 0}
        unavailable: {type: integer, minimum: 0}
    CostStats:
      type: object
      additionalProperties: false
      required: [knownSubtotalUsd, coverage]
      properties:
        knownSubtotalUsd: {type: number, minimum: 0}
        coverage: {$ref: "#/components/schemas/CostCoverage"}
    AccountingStats:
      type: object
      additionalProperties: false
      required: [usage, cost]
      properties:
        usage: {$ref: "#/components/schemas/UsageStats"}
        cost: {$ref: "#/components/schemas/CostStats"}
    StatsEnvelope:
      type: object
      additionalProperties: false
      required: [state, result, error]
      properties:
        state: {$ref: "#/components/schemas/EmptyState"}
        result: {$ref: "#/components/schemas/Stats"}
        error: {type: "null"}
    DeleteProfileEnvelope:
      type: object
      additionalProperties: false
      required: [state, result, error]
      properties:
        state: {$ref: "#/components/schemas/EmptyState"}
        result:
          type: object
          additionalProperties: false
          required: [deleted, profileId]
          properties:
            deleted: {type: boolean, const: true}
            profileId: {$ref: "#/components/schemas/ProfileID"}
        error: {type: "null"}
    RecoveryPolicy:
      type: object
      additionalProperties: false
      description: Complete selected-target recovery policy. No execution defaults are inferred. Create new
        settings from result.defaults.recoveryPolicy returned by listProfiles.
      required:
      - maxAttempts
      - retryOn
      - backoff
      oneOf:
      - required: [repairInvalidOutput]
        not: {required: [jsonRepair, rerun]}
      - required: [jsonRepair, rerun]
        not: {required: [repairInvalidOutput]}
      properties:
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 10
          description: Total provider-call budget including the first call, transport retries and semantic
            repairs.
        retryOn:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - network
            - rate_limit
            - server_error
            - empty_response
            - provider_retry
          description: An empty array disables ordinary retries.
        repairInvalidOutput:
          type: boolean
          description: Repair invalid structured output using its original schema and the remaining call budget.
          deprecated: true
        jsonRepair:
          oneOf:
          - {$ref: '#/components/schemas/RepairPlan'}
          - type: 'null'
          description: Explicit two-target JSON repair plan. The initial target runs first, then optional escalation.
        rerun:
          oneOf:
          - {$ref: '#/components/schemas/RerunPlan'}
          - type: 'null'
          description: Optional fresh generation from the original input, followed by its own JSON repair plan.
        backoff:
          $ref: '#/components/schemas/RecoveryBackoff'
    RecoveryTarget:
      type: object
      oneOf:
      - required: [source, profileId]
        additionalProperties: false
        properties:
          source: {type: string, const: profile}
          profileId: {$ref: '#/components/schemas/ProfileID'}
          modelId: {type: string, maxLength: 512}
          reasoningEffort: {type: string, enum: [lowest, middle, highest]}
          providerOptions: {type: object, additionalProperties: true}
      - required: [source]
        additionalProperties: false
        properties:
          source: {type: string, const: generation}
    RepairPlan:
      type: object
      additionalProperties: false
      required: [initial, escalation]
      properties:
        initial: {$ref: '#/components/schemas/RecoveryTarget'}
        escalation:
          oneOf:
          - {$ref: '#/components/schemas/RecoveryTarget'}
          - type: 'null'
    RerunPlan:
      type: object
      additionalProperties: false
      required: [target, jsonRepair]
      properties:
        target: {$ref: '#/components/schemas/RecoveryTarget'}
        jsonRepair:
          oneOf:
          - {$ref: '#/components/schemas/RepairPlan'}
          - type: 'null'
    RecoveryBackoff:
      type: object
      additionalProperties: false
      required:
      - baseDelayMs
      - maxDelayMs
      properties:
        baseDelayMs:
          type: integer
          minimum: 0
          maximum: 60000
        maxDelayMs:
          type: integer
          minimum: 0
          maximum: 600000
          description: Must be at least baseDelayMs. Limits calculated backoff; valid Retry-After on HTTP
            429 or 503 remains a server minimum.
    RunRequest:
      type: object
      additionalProperties: false
      required:
      - profileId
      - userPrompt
      - callType
      - recoveryPolicy
      properties:
        profileId:
          $ref: '#/components/schemas/ProfileID'
        modelId:
          type: string
          maxLength: 512
        systemPrompt:
          type: string
          maxLength: 32768
        userPrompt:
          type: string
          minLength: 1
          maxLength: 65536
        callType:
          type: string
          enum:
          - text
          - structured
        schema:
          type: object
        reasoningEffort:
          type: string
          enum:
          - lowest
          - middle
          - highest
        providerOptions:
          type: object
        cacheMode:
          type: string
          enum:
          - 'off'
          - cache
          - refresh
        webSearch:
          type: boolean
          default: false
          description: Use native provider web search when supported, otherwise the configured Jina fallback.
            Cache semantics remain unchanged.
        cacheVersion:
          type: string
          maxLength: 64
        timeoutMs:
          type: integer
          minimum: 0
          maximum: 60000
          description: Zero or omission selects the deployment maximum; a positive value may only lower it.
        recoveryPolicy:
          $ref: '#/components/schemas/RecoveryPolicy'
        origin:
          $ref: '#/components/schemas/RunOrigin'
    RunOrigin:
      type: object
      additionalProperties: false
      properties:
        client: {type: string, maxLength: 256}
        component: {type: string, maxLength: 256}
        operationId: {type: string, maxLength: 256}
        parentRunId: {type: string, maxLength: 256}
        jobId: {type: string, maxLength: 256}
        testRunId: {type: string, maxLength: 256}
        testId: {type: string, maxLength: 256}
        sourceRevision: {type: string, maxLength: 256}
    Usage:
      type: object
      additionalProperties: false
      required: [inputTokens, cacheReadTokens, cacheCreationTokens, outputTokens, reasoningTokens, promptTokens, completionTokens, totalTokens, status]
      properties:
        inputTokens: {type: integer, minimum: 0}
        cacheReadTokens: {type: integer, minimum: 0}
        cacheCreationTokens: {type: integer, minimum: 0}
        outputTokens: {type: integer, minimum: 0}
        reasoningTokens: {type: integer, minimum: 0}
        promptTokens: {type: integer, minimum: 0, description: inputTokens + cacheReadTokens + cacheCreationTokens.}
        completionTokens: {type: integer, minimum: 0, description: outputTokens + reasoningTokens.}
        totalTokens: {type: integer, minimum: 0}
        status: {type: string, enum: [complete, partial, unavailable, inconsistent]}
    Cost:
      type: object
      additionalProperties: false
      required: [knownSubtotalUsd, status, source, knownObservations, unknownObservations]
      properties:
        knownSubtotalUsd: {type: number, minimum: 0}
        status: {type: string, enum: [exact, partial, unknown, unavailable]}
        source: {type: string, maxLength: 64}
        knownObservations: {type: integer, minimum: 0}
        unknownObservations: {type: integer, minimum: 0}
    AccountingLedger:
      type: object
      additionalProperties: false
      required: [usage, cost]
      properties:
        usage: {$ref: "#/components/schemas/Usage"}
        cost: {$ref: "#/components/schemas/Cost"}
    Accounting:
      type: object
      additionalProperties: false
      required: [result, provider]
      properties:
        result: {$ref: "#/components/schemas/AccountingLedger"}
        provider: {$ref: "#/components/schemas/AccountingLedger"}
    ExecutionTarget:
      type: object
      additionalProperties: false
      required: [profileId, provider, protocol, endpoint, modelId]
      properties:
        profileId: {$ref: "#/components/schemas/ProfileID"}
        provider: {type: string, minLength: 1, maxLength: 128}
        protocol: {type: string, minLength: 1, maxLength: 128}
        endpoint: {type: string, format: uri, pattern: "^https://", maxLength: 2048}
        modelId: {type: string, minLength: 1, maxLength: 512}
    ResultSource:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {type: string, const: none}
        - type: object
          additionalProperties: false
          required: [kind, attemptNumber, producer]
          properties:
            kind: {type: string, const: provider}
            attemptNumber: {type: integer, minimum: 1, maximum: 10}
            producer: {$ref: "#/components/schemas/ExecutionTarget"}
        - type: object
          additionalProperties: false
          required: [kind, producer]
          properties:
            kind: {type: string, const: cache}
            producer: {$ref: "#/components/schemas/ExecutionTarget"}
    Attempt:
      type: object
      additionalProperties: false
      required:
      - number
      - profileId
      - target
      - retryable
      - wait
      - duration
      - repair
      - providerUsed
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 10
        profileId:
          $ref: '#/components/schemas/ProfileID'
        target:
          $ref: '#/components/schemas/ExecutionTarget'
        category:
          type: string
          maxLength: 64
        httpStatus:
          type: integer
          minimum: 100
          maximum: 599
        code:
          type: string
          maxLength: 80
        type:
          type: string
          maxLength: 80
        providerRequestId:
          type: string
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$
        retryable:
          type: boolean
        wait:
          type: integer
          minimum: 0
          description: Nanoseconds.
        duration:
          type: integer
          minimum: 0
          description: Nanoseconds.
        repair:
          type: boolean
        providerUsed:
          type: boolean
          description: True only when the local model transport observed request headers being written; does not prove remote execution or billing.
        stage: {type: string, maxLength: 64}
        branch: {type: string, enum: [original, rerun]}
        triggerAttemptNumber: {type: integer, minimum: 1, maximum: 10}
        inputAttemptNumbers:
          type: array
          maxItems: 10
          items: {type: integer, minimum: 1, maximum: 10}
        transportRetryOfAttempt: {type: integer, minimum: 1, maximum: 10}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        reasoningEffort: {type: string, enum: [lowest, middle, highest]}
        dispatchObserved: {type: boolean}
        stream:
          $ref: '#/components/schemas/StreamDiagnostics'
        waitDiagnostics:
          $ref: '#/components/schemas/WaitDiagnostics'
    CacheResult:
      type: object
      additionalProperties: false
      required: [mode, status, served, written]
      properties:
        mode: {type: string, enum: ["off", cache, refresh]}
        status:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Cache outcome. A write_failed value means the accepted inference
            succeeded but persisting its canonical cache projection failed;
            served and written remain false and the run itself is still
            successful. Lookup and integrity failures are returned as errors.
        operationHash: {type: string, maxLength: 128}
        originalOperationHash: {type: string, maxLength: 128}
        rerunOperationHash: {type: string, maxLength: 128}
        version: {type: string, maxLength: 64}
        served: {type: boolean}
        written: {type: boolean}
    RunArtifact:
      type: object
      additionalProperties: false
      required: [artifactId, kind, state, sha256, sizeBytes, contentType]
      properties:
        artifactId: {$ref: "#/components/schemas/Identifier"}
        kind: {type: string, enum: [trace, parse-failure-response, diagnostic-event]}
        state: {type: string, const: available}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        sizeBytes: {type: integer, minimum: 1}
        contentType: {type: string, const: application/json}
    RunResult:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - runId
      - status
      - output
      - callId
      - traceId
      - selectedTarget
      - resultSource
      - accounting
      - attempts
      - cache
      - artifacts
      - providerInvoked
      - totalCallDurationMs
      - totalWaitMs
      - totalActualWaitMs
      - overBudgetMs
      - usedRepair
      properties:
        schemaVersion:
          type: integer
          const: 4
        runId:
          $ref: '#/components/schemas/Identifier'
        status:
          type: string
          enum:
          - succeeded
          - failed
          - timeout
        output: {}
        search:
          $ref: '#/components/schemas/WebSearchResult'
        callId:
          $ref: '#/components/schemas/Identifier'
        traceId:
          $ref: '#/components/schemas/Identifier'
        origin:
          $ref: '#/components/schemas/RunOrigin'
        selectedTarget:
          $ref: '#/components/schemas/ExecutionTarget'
        resultSource:
          $ref: '#/components/schemas/ResultSource'
        accounting:
          $ref: '#/components/schemas/Accounting'
        attempts:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Attempt'
        cache:
          $ref: '#/components/schemas/CacheResult'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/RunArtifact'
        providerInvoked:
          type: boolean
          description: True when at least one model attempt observed request headers being written; search-only and pre-dispatch failures remain false, and the value does not prove remote execution or billing.
        totalCallDurationMs:
          type: integer
          minimum: 0
          description: Elapsed runtime call duration in milliseconds.
        totalWaitMs:
          type: integer
          minimum: 0
          description: Sum of retry waits in milliseconds.
        totalActualWaitMs:
          type: integer
          minimum: 0
          nullable: true
          description: Measured elapsed retry-wait time in milliseconds; planned wait remains totalWaitMs.
        overBudgetMs:
          type: integer
          minimum: 0
          description: Amount by which an explicit per-run timeout budget was exceeded.
        usedRepair:
          type: boolean
          description: Whether structured-output repair was used.
        generationTarget:
          $ref: '#/components/schemas/ExecutionTarget'
        stopReason:
          type: string
          enum: [succeeded, attempts_exhausted, recovery_exhausted, deadline_exceeded, canceled, terminal_error, configuration_error, repair_input_limit_exceeded, response_limit_exceeded]
        diagnostics:
          $ref: '#/components/schemas/RunDiagnostics'
    RunDiagnostics:
      type: object
      additionalProperties: false
      required: [attemptsUsed, attemptsRemaining, elapsedMs, totalActualWaitMs, receivedBytes, eventCount, outputBytes, outputCodePoints]
      properties:
        stage: {type: string, maxLength: 64}
        branch: {type: string, enum: [original, rerun]}
        stopReason: {type: string, maxLength: 64}
        attemptsUsed: {type: integer, minimum: 0, maximum: 10}
        attemptsRemaining: {type: integer, minimum: 0, maximum: 10}
        elapsedMs: {type: integer, minimum: 0}
        totalActualWaitMs: {type: integer, minimum: 0}
        receivedBytes: {type: integer, minimum: 0}
        eventCount: {type: integer, minimum: 0}
        outputBytes: {type: integer, minimum: 0}
        outputCodePoints: {type: integer, minimum: 0}
        effectiveTimeoutMs: {type: integer, minimum: 0, nullable: true}
        deadlineAt: {type: string, format: date-time, nullable: true}
        branchCaches:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [branch, generationTarget, cache]
            properties:
              branch: {type: string, enum: [original, rerun]}
              generationTarget: {$ref: '#/components/schemas/ExecutionTarget'}
              cache: {$ref: '#/components/schemas/CacheResult'}
    StreamDiagnostics:
      type: object
      additionalProperties: false
      required: [receivedBytes, eventCount, outputBytes, outputCodePoints]
      properties:
        receivedBytes: {type: integer, minimum: 0}
        eventCount: {type: integer, minimum: 0}
        outputBytes: {type: integer, minimum: 0}
        outputCodePoints: {type: integer, minimum: 0}
        firstEventMs: {type: integer, minimum: 0, nullable: true}
        firstOutputMs: {type: integer, minimum: 0, nullable: true}
        lastEventAt: {type: string, format: date-time, nullable: true}
        lastOutputAt: {type: string, format: date-time, nullable: true}
        terminalState: {type: string, enum: [not_streaming, awaiting_terminal, completed, incomplete, failed, missing]}
    WaitDiagnostics:
      type: object
      additionalProperties: false
      required: [plannedMs, actualMs]
      properties:
        reason: {type: string, maxLength: 64}
        plannedMs: {type: integer, minimum: 0}
        actualMs: {type: integer, minimum: 0}
        retryAfterMs: {type: integer, minimum: 0}
    RunProgressEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, sequence, type, data]
      properties:
        schemaVersion: {type: integer, const: 1}
        sequence: {type: integer, minimum: 1}
        runId: {$ref: '#/components/schemas/Identifier'}
        callId: {$ref: '#/components/schemas/Identifier'}
        traceId: {$ref: '#/components/schemas/Identifier'}
        type: {type: string, enum: [run.started, run.progress, run.completed, run.failed]}
        data: {}
    WebSearchResult:
      type: object
      additionalProperties: false
      description: Evidence used to produce this answer. Retained on cache hits; executed describes the original answer, not a new search. Model token accounting excludes search fees.
      required: [mode, executed, sources, costStatus]
      properties:
        mode: {type: string, enum: [native, jina]}
        executed: {type: boolean}
        costStatus: {type: string, const: unavailable}
        entryPointHtml: {type: string, maxLength: 32768, description: "Provider search suggestions. Display only in a sandboxed iframe, never as trusted application HTML."}
        citations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [url, title, startIndex, endIndex]
            properties:
              url: {type: string, format: uri}
              title: {type: string}
              startIndex: {type: integer, minimum: 0}
              endIndex: {type: integer, minimum: 1}
        sources:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [url, title]
            properties:
              url: {type: string, format: uri}
              title: {type: string}
    RunState:
      type: object
      additionalProperties: false
      properties:
        lastRunId: {$ref: "#/components/schemas/Identifier"}
        lastTraceId: {$ref: "#/components/schemas/Identifier"}
    RunEnvelope:
      type: object
      additionalProperties: false
      required: [state, result, error]
      properties:
        state: {$ref: "#/components/schemas/RunState"}
        result: {$ref: "#/components/schemas/RunResult"}
        error: {type: "null"}
    RunErrorEnvelope:
      type: object
      additionalProperties: false
      required: [state, result, error]
      properties:
        state: {$ref: "#/components/schemas/RunState"}
        result: {type: "null"}
        error: {$ref: "#/components/schemas/Error"}
    TraceObservation:
      type: object
      additionalProperties: false
      required: [sequence, type, data, createdAt]
      properties:
        sequence: {type: integer, minimum: 0}
        type: {type: string, minLength: 1, maxLength: 64}
        data: {type: object}
        createdAt: {type: string, format: date-time}
    TraceArtifact:
      type: object
      additionalProperties: false
      required: [artifactId, kind, state, sha256, sizeBytes, contentType, createdAt]
      properties:
        artifactId: {$ref: "#/components/schemas/Identifier"}
        kind: {type: string, enum: [trace, parse-failure-response, diagnostic-event]}
        state: {type: string, enum: [available, deleting, unavailable]}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        sizeBytes: {type: integer, minimum: 1}
        contentType: {type: string, const: application/json}
        createdAt: {type: string, format: date-time}
    TraceView:
      type: object
      additionalProperties: false
      required: [traceId, record, observations, artifacts, resources]
      properties:
        traceId: {$ref: "#/components/schemas/Identifier"}
        record: {$ref: "#/components/schemas/RunResult"}
        observations:
          type: array
          items: {$ref: "#/components/schemas/TraceObservation"}
        artifacts:
          type: array
          items: {$ref: "#/components/schemas/TraceArtifact"}
        resources: {$ref: "#/components/schemas/TraceResources"}
    TraceResource:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available: {type: boolean}
        payload: {type: object}
        message: {type: string, minLength: 1, maxLength: 256}
    TraceResources:
      type: object
      additionalProperties: false
      required: [request, response]
      properties:
        request: {$ref: "#/components/schemas/TraceResource"}
        response: {$ref: "#/components/schemas/TraceResource"}
    TraceEnvelope:
      type: object
      additionalProperties: false
      required: [state, result, error]
      properties:
        state: {$ref: "#/components/schemas/EmptyState"}
        result: {$ref: "#/components/schemas/TraceView"}
        error: {type: "null"}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok, unavailable]}
