openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Harden LLM API
  version: 1.0.0
  description: >-
    Provider-neutral self-hosted LLM runtime API. All application responses use
    a stable state/result/error envelope, except health probes and successful
    artifact redirects. Clients must not automatically retry an ambiguous run.
servers:
  - url: /
    description: Same-origin production gateway.
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Process and dependency health.
  - name: Authentication
    description: Opaque local bearer sessions and optional static CLI bearer authentication.
  - name: State
    description: Owner-scoped client workspace state.
  - name: Profiles
    description: Validated profiles and encrypted credential bundles.
  - name: Runs
    description: Synchronous provider-neutral execution and history.
  - name: Traces
    description: Redacted domain traces and authorized artifacts.
  - name: Durable operations
    description: Internal service-to-service durable structured Harden operations.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Check process liveness
      description: Returns success without contacting downstream dependencies.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Check dependency readiness
      description: Checks the application database migration state and artifact bucket.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Create a bearer session
      description: Verifies local credentials and returns the opaque token exactly once.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          $ref: "#/components/responses/LoginSuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Revoke the active session
      description: Revokes the bearer session used to authorize this request. A configured static CLI token is not revocable here; rotate or remove it in deployment configuration.
      responses:
        "200":
          $ref: "#/components/responses/LogoutSuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [Authentication]
      summary: Read the active session
      description: Returns redacted owner and expiry metadata without the bearer token.
      responses:
        "200":
          $ref: "#/components/responses/SessionSuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/state:
    get:
      operationId: getState
      tags: [State]
      summary: Read workspace state
      description: Returns the authenticated owner's persisted client-owned fields.
      responses:
        "200":
          $ref: "#/components/responses/StateSuccess"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: saveState
      tags: [State]
      summary: Save workspace state
      description: Strictly validates and replaces the authenticated owner's state document.
      requestBody:
        $ref: "#/components/requestBodies/ClientState"
      responses:
        "200":
          $ref: "#/components/responses/StateSuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles:
    get:
      operationId: listProfiles
      tags: [Profiles]
      summary: List redacted profiles
      description: Returns safe profile configuration and write-only credential status.
      responses:
        "200":
          $ref: "#/components/responses/ProfilesSuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/history:
    get:
      operationId: listHistory
      tags: [Runs]
      summary: List run history
      description: Returns a stable owner-scoped page ordered by start time and run ID.
      parameters:
        - $ref: "#/components/parameters/HistoryCursor"
        - $ref: "#/components/parameters/HistoryLimit"
        - $ref: "#/components/parameters/HistoryPage"
      responses:
        "200":
          $ref: "#/components/responses/HistorySuccess"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearHistory
      tags: [Runs]
      summary: Clear run history
      description: Deletes all owned runs, domain traces, observations, artifact metadata, and artifact object bodies.
      responses:
        "200":
          $ref: "#/components/responses/ClearHistorySuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/history/{historyID}:
    parameters:
      - $ref: "#/components/parameters/HistoryID"
    delete:
      operationId: deleteHistory
      tags: [Runs]
      summary: Delete one history item
      description: Deletes an owned run, its domain trace, observations, artifact metadata, and artifact object bodies.
      responses:
        "200":
          $ref: "#/components/responses/DeleteHistorySuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/stats:
    get:
      operationId: getStats
      tags: [Runs]
      summary: Read aggregate run statistics
      description: Computes authoritative owner-scoped totals directly from persisted run records.
      responses:
        "200":
          $ref: "#/components/responses/StatsSuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles/bundle:
    get:
      operationId: exportProfileBundle
      tags: [Profiles]
      summary: Export the profile bundle
      description: Returns profiles and opaque authenticated encrypted credentials.
      responses:
        "200":
          $ref: "#/components/responses/BundleSuccess"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: importProfileBundle
      tags: [Profiles]
      summary: Replace the profile bundle
      description: Authenticates, probes, and atomically replaces the complete owner bundle.
      requestBody:
        $ref: "#/components/requestBodies/ProfileBundle"
      responses:
        "200":
          $ref: "#/components/responses/ProfilesSuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles/{profileID}:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    put:
      operationId: saveProfile
      tags: [Profiles]
      summary: Save a profile
      description: Validates and probes a profile before atomically persisting its credential.
      requestBody:
        $ref: "#/components/requestBodies/ProfileSave"
      responses:
        "200":
          $ref: "#/components/responses/ProfileSuccess"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProfile
      tags: [Profiles]
      summary: Delete a profile
      description: Deletes an owned profile unless the remaining backup graph references it.
      responses:
        "200":
          $ref: "#/components/responses/DeleteProfileSuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles/{profileID}/models:refresh:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    post:
      operationId: refreshProfileModels
      tags: [Profiles]
      summary: Refresh profile models
      description: Discovers and normalizes models without replacing prior state on failure.
      responses:
        "200":
          $ref: "#/components/responses/ProfileSuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/run:
    post:
      operationId: run
      tags: [Runs]
      summary: Execute one LLM call
      description: >-
        Executes exactly one root runtime call. The effective deadline cannot exceed
        60000 milliseconds, and this HTTP operation is never retried by the gateway.
        Send Accept: text/event-stream to receive authenticated, request-bound
        progress events on the same POST; the default response remains JSON.
      requestBody:
        $ref: "#/components/requestBodies/Run"
      responses:
        "200":
          $ref: "#/components/responses/RunSuccess"
        "422":
          $ref: "#/components/responses/RunCredentialRequired"
        "504":
          $ref: "#/components/responses/RunTimeout"
        default:
          $ref: "#/components/responses/RunError"
  /internal/v1/llm-operations:
    post:
      operationId: submitDurableOperation
      tags: [Durable operations]
      summary: Submit one durable structured operation
      description: >-
        Accepts one account-scoped operation from an authenticated platform
        service and starts the server-owned Harden Temporal workflow. The
        caller must reconcile retries with the same operation ID and input
        digest; changed input is a conflict.
      security:
        - serviceBearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/DurableOperation"
      responses:
        "202":
          $ref: "#/components/responses/DurableOperationAccepted"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /internal/v1/llm-operations/{operationID}:
    parameters:
      - $ref: "#/components/parameters/OperationID"
    get:
      operationId: getDurableOperation
      tags: [Durable operations]
      summary: Read one durable structured operation
      description: Returns the account-scoped status and published structured output.
      security:
        - serviceBearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/DurableOperationSuccess"
        default:
          $ref: "#/components/responses/Error"
  /internal/v1/llm-operations/{operationID}:cancel:
    parameters:
      - $ref: "#/components/parameters/OperationID"
    post:
      operationId: cancelDurableOperation
      tags: [Durable operations]
      summary: Cancel one durable structured operation
      description: Cancels future work for an authorized operation; it does not revoke the caller token or undo a published result.
      security:
        - serviceBearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/DurableOperationSuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/traces/{traceID}:
    parameters:
      - $ref: "#/components/parameters/TraceID"
    get:
      operationId: getTrace
      tags: [Traces]
      summary: Read a domain trace
      description: Returns one redacted trace with ordered observations, safe artifact metadata, and explicitly available persisted request/response resources.
      responses:
        "200":
          $ref: "#/components/responses/TraceSuccess"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/traces/{traceID}/artifacts/{artifactID}:
    parameters:
      - $ref: "#/components/parameters/TraceID"
      - $ref: "#/components/parameters/ArtifactID"
    get:
      operationId: getArtifact
      tags: [Traces]
      summary: Authorize an artifact download
      description: Authorizes owner metadata before issuing a short-lived presigned redirect.
      responses:
        "303":
          description: A short-lived URL for the authorized artifact.
          headers:
            Location:
              required: true
              description: Presigned artifact URL. Treat the complete value as sensitive.
              schema:
                type: string
                format: uri
              example: https://artifacts.example.test/harden-llm/example.json?X-Amz-Expires=60
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: A random opaque session token returned once by login, or the configured static CLI token.
    serviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: A deployment-scoped service credential. Customer bearer tokens are not accepted on internal routes.
  parameters:
    HistoryCursor:
      name: cursor
      in: query
      required: false
      description: Opaque stable pagination cursor returned by the prior page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    HistoryLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of history items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    HistoryPage:
      name: page
      in: query
      required: false
      description: One-based numbered page. It is mutually exclusive with cursor.
      schema:
        type: integer
        format: int64
        minimum: 1
    HistoryID:
      name: historyID
      in: path
      required: true
      description: Stable run identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    ProfileID:
      name: profileID
      in: path
      required: true
      description: UTF-8 profile identifier; the encoded path segment must not contain a slash.
      schema:
        $ref: "#/components/schemas/ProfileID"
    TraceID:
      name: traceID
      in: path
      required: true
      description: Stable trace identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    ArtifactID:
      name: artifactID
      in: path
      required: true
      description: Stable artifact identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    OperationID:
      name: operationID
      in: path
      required: true
      description: Stable caller-supplied durable operation identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
  requestBodies:
    Login:
      required: true
      description: Local user credentials. Maximum encoded body size is 65536 bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginRequest"
          examples:
            valid:
              value:
                email: operator@example.test
                password: correct horse battery staple
    ClientState:
      required: true
      description: Complete client-owned state. Maximum encoded body size is 65536 bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientState"
          examples:
            workspace:
              value:
                schemaVersion: 3
                selectedProfileId: Primary
                modelId: gpt-example
                userPrompt: Summarize the incident.
                callType: text
                cacheMode: 'off'
                recoveryPolicy:
                  maxAttempts: 4
                  retryOn:
                  - network
                  - rate_limit
                  - server_error
                  - empty_response
                  - provider_retry
                  jsonRepair: null
                  rerun: null
                  backoff:
                    baseDelayMs: 500
                    maxDelayMs: 8000
    ProfileSave:
      required: true
      description: Profile and write-only credential. Maximum encoded body size is 262144 bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileSaveRequest"
          examples:
            create:
              value:
                profile:
                  schemaVersion: 3
                  llmProfile: Primary
                  provider: openai
                  apiInferenceType: responses
                  endpointCredentialScope: user
                  baseUrl: https://api.openai.com/v1
                  modelId: gpt-example
                  pricing: null
                  supportsTemperature: true
                  supportsContractedStructuredOutput: true
                  tokensParam: max_output_tokens
                  responsesTokensParam: max_output_tokens
                  defaultOptions: {}
                  recoveryPolicy:
                    maxAttempts: 4
                    retryOn:
                    - network
                    - rate_limit
                    - server_error
                    - empty_response
                    - provider_retry
                    jsonRepair:
                      initial:
                        source: generation
                      escalation:
                        source: generation
                    rerun: null
                    backoff:
                      baseDelayMs: 500
                      maxDelayMs: 8000
                credentialId: primary-openai
                credential:
                  apiKey: example-write-only-key
    ProfileBundle:
      required: true
      description: Complete encrypted bundle. Maximum encoded body size is 2097152 bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileBundle"
          examples:
            replace:
              value:
                schemaVersion: 3
                bundleId: bundle-example
                createdAt: '2026-07-13T12:00:00Z'
                profiles:
                  Primary:
                    schemaVersion: 3
                    llmProfile: Primary
                    provider: openai
                    apiInferenceType: responses
                    endpointCredentialScope: user
                    baseUrl: https://api.openai.com/v1
                    modelId: gpt-example
                    pricing: null
                    supportsTemperature: true
                    supportsContractedStructuredOutput: true
                    tokensParam: max_output_tokens
                    responsesTokensParam: max_output_tokens
                    defaultOptions: {}
                    recoveryPolicy:
                      maxAttempts: 4
                      retryOn:
                      - network
                      - rate_limit
                      - server_error
                      - empty_response
                      - provider_retry
                      jsonRepair:
                        initial:
                          source: generation
                        escalation:
                          source: generation
                      rerun: null
                      backoff:
                        baseDelayMs: 500
                        maxDelayMs: 8000
                credentialIds:
                  Primary: primary-openai
                credentials:
                - schemaVersion: 1
                  binding:
                    ownerId: owner-example
                    credentialId: primary-openai
                    origin: https://api.openai.com
                  scope: user
                  apiInferenceTypes:
                  - responses
                  encrypted:
                    schemaVersion: 1
                    algorithm: AES-256-GCM
                    keyId: key-2026
                    nonce: AAAAAAAAAAAAAAAA
                    ciphertext: AAAAAAAAAAAAAAAAAAAAAA
                  createdAt: '2026-07-13T12:00:00Z'
                  updatedAt: '2026-07-13T12:00:00Z'
    Run:
      required: true
      description: One synchronous run. Maximum encoded body size is 262144 bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RunRequest"
          examples:
            text:
              value:
                profileId: Primary
                userPrompt: Reply with OK.
                callType: text
                cacheMode: 'off'
                timeoutMs: 60000
                recoveryPolicy:
                  maxAttempts: 1
                  retryOn:
                  - network
                  - rate_limit
                  - server_error
                  - empty_response
                  - provider_retry
                  jsonRepair:
                    initial:
                      source: generation
                    escalation:
                      source: generation
                  rerun: null
                  backoff:
                    baseDelayMs: 500
                    maxDelayMs: 8000
    DurableOperation:
      required: true
      description: Account-scoped durable structured operation input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DurableOperationRequest"
          examples:
            structured:
              value:
                operationId: ner-op-example
                accountId: account-example
                inputDigest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                profileId: Primary
                userPrompt: Extract organizations from this response.
                callType: structured
                schema:
                  type: object
                  additionalProperties: false
                  properties:
                    mentions:
                      type: array
                  required: [mentions]
                cacheMode: 'off'
                timeoutMs: 120000
                recoveryPolicy:
                  maxAttempts: 1
                  retryOn: []
                  jsonRepair: null
                  rerun: null
                  backoff:
                    baseDelayMs: 0
                    maxDelayMs: 0
  responses:
    HealthOK:
      description: The process or all required dependencies are ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
          examples:
            ok:
              value: {status: ok}
    HealthUnavailable:
      description: At least one required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
          examples:
            unavailable:
              value: {status: unavailable}
    Error:
      description: Stable error envelope. Status is selected by the operation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalidRequest:
              value:
                state: {}
                result: null
                error:
                  code: invalid_request
                  message: The request is invalid.
    DurableOperationAccepted:
      description: The operation was durably admitted to the Harden Temporal workflow.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DurableOperationView"
          examples:
            accepted:
              value:
                schemaVersion: harden-llm-operation.v1
                operationId: ner-op-example
                accountId: account-example
                inputDigest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                status: accepted
                createdAt: '2026-07-13T12:00:00Z'
                updatedAt: '2026-07-13T12:00:00Z'
    DurableOperationSuccess:
      description: The current durable operation state and any published structured output.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DurableOperationView"
          examples:
            completed:
              value:
                schemaVersion: harden-llm-operation.v1
                operationId: ner-op-example
                accountId: account-example
                inputDigest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                status: succeeded
                output:
                  mentions: []
                runId: harden-run-example
                traceId: harden-trace-example
                createdAt: '2026-07-13T12:00:00Z'
                updatedAt: '2026-07-13T12:00:02Z'
    LoginSuccess:
      description: Session token and redacted identity. The access token is returned only here.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginEnvelope"
          examples:
            authenticated:
              value:
                state: {}
                result:
                  accessToken: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                  expiresAt: "2026-07-13T13:00:00Z"
                  principal:
                    ownerId: owner-example
                    email: operator@example.test
                    sessionId: session-example
                    expiresAt: "2026-07-13T13:00:00Z"
                error: null
    LogoutSuccess:
      description: The active bearer session was revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LogoutEnvelope"
          examples:
            revoked:
              value:
                state: {}
                result: {revoked: true}
                error: null
    SessionSuccess:
      description: Redacted current session metadata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionEnvelope"
          examples:
            current:
              value:
                state: {}
                result:
                  ownerId: owner-example
                  email: operator@example.test
                  sessionId: session-example
                  expiresAt: "2026-07-13T13:00:00Z"
                error: null
    StateSuccess:
      description: The canonical current client state is carried in the state field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StateEnvelope"
          examples:
            workspace:
              value:
                state:
                  schemaVersion: 3
                  selectedProfileId: Primary
                  modelId: gpt-example
                  userPrompt: Summarize the incident.
                  callType: text
                  cacheMode: 'off'
                  recoveryPolicy:
                    maxAttempts: 4
                    retryOn:
                    - network
                    - rate_limit
                    - server_error
                    - empty_response
                    - provider_retry
                    jsonRepair: null
                    rerun: null
                    backoff:
                      baseDelayMs: 500
                      maxDelayMs: 8000
                result: null
                error: null
    ProfilesSuccess:
      description: Redacted profile states without encrypted or plaintext credential material.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfilesEnvelope"
          examples:
            list:
              value:
                state: {}
                result:
                  profiles:
                  - profile:
                      schemaVersion: 3
                      llmProfile: Primary
                      provider: openai
                      apiInferenceType: responses
                      endpointCredentialScope: user
                      baseUrl: https://api.openai.com/v1
                      modelId: gpt-example
                      pricing: null
                      supportsTemperature: true
                      supportsContractedStructuredOutput: true
                      tokensParam: max_output_tokens
                      responsesTokensParam: max_output_tokens
                      defaultOptions: {}
                      recoveryPolicy:
                        maxAttempts: 4
                        retryOn:
                        - network
                        - rate_limit
                        - server_error
                        - empty_response
                        - provider_retry
                        jsonRepair:
                          initial:
                            source: generation
                          escalation:
                            source: generation
                        rerun: null
                        backoff:
                          baseDelayMs: 500
                          maxDelayMs: 8000
                    credential:
                      schemaVersion: 1
                      credentialId: primary-openai
                      scope: user
                      origin: https://api.openai.com
                      apiInferenceTypes:
                      - responses
                      configured: true
                      createdAt: '2026-07-13T12:00:00Z'
                      updatedAt: '2026-07-13T12:00:00Z'
                  defaults:
                    recoveryPolicy:
                      maxAttempts: 4
                      retryOn:
                      - network
                      - rate_limit
                      - server_error
                      - empty_response
                      - provider_retry
                      jsonRepair:
                        initial:
                          source: generation
                        escalation:
                          source: generation
                      rerun: null
                      backoff:
                        baseDelayMs: 500
                        maxDelayMs: 8000
                error: null
    ProfileSuccess:
      description: One redacted profile and its write-only credential status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileEnvelope"
          examples:
            saved:
              value:
                state: {}
                result:
                  profile:
                    schemaVersion: 3
                    llmProfile: Primary
                    provider: openai
                    apiInferenceType: responses
                    endpointCredentialScope: user
                    baseUrl: https://api.openai.com/v1
                    modelId: gpt-example
                    pricing: null
                    supportsTemperature: true
                    supportsContractedStructuredOutput: true
                    tokensParam: max_output_tokens
                    responsesTokensParam: max_output_tokens
                    defaultOptions: {}
                    recoveryPolicy:
                      maxAttempts: 4
                      retryOn:
                      - network
                      - rate_limit
                      - server_error
                      - empty_response
                      - provider_retry
                      jsonRepair:
                        initial:
                          source: generation
                        escalation:
                          source: generation
                      rerun: null
                      backoff:
                        baseDelayMs: 500
                        maxDelayMs: 8000
                  credential:
                    schemaVersion: 1
                    credentialId: primary-openai
                    scope: user
                    origin: https://api.openai.com
                    apiInferenceTypes:
                    - responses
                    configured: true
                    createdAt: '2026-07-13T12:00:00Z'
                    updatedAt: '2026-07-13T12:00:00Z'
